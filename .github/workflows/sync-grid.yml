name: Sync Grid data to KV

# Grid template: writes ONLY `network-directory`, `grid-summary:*`, `grid-ext-item:*` and
# `grid-ext-index:*` keys (prod + staging), plus publisher favicons in R2 (aggregator/assets/favicons/).
# Independent of sync-kv.yml — never re-syncs a site. Every run always rebuilds the
# network directory from latest main. Push runs sync only the summary files changed in
# that push, so if a pending push run is evicted from the concurrency queue its summary
# files are NOT synced by the replacing run; they are picked up by the next hourly
# scheduled run, which syncs all summaries (worst-case summary staleness: 1 hour).
on:
  push:
    branches: [main]
    paths:
      - "grid-summaries/**"
      - "dashboard-index.yaml"
      - "sites/*/site.yaml"
      - "groups/**"
      - "org.yaml"
      - "overrides/config/**"
  schedule:
    - cron: "15 * * * *" # hourly backstop: directory + all summaries
  workflow_dispatch:
    inputs:
      all_summaries:
        description: "Re-sync every grid-summaries file"
        type: boolean
        default: false
      recheck_images:
        description: "Re-check every indexed bundle story's image and remove those that no longer load"
        type: boolean
        default: false

concurrency:
  group: sync-grid
  cancel-in-progress: false

jobs:
  # Most dashboard saves rewrite dashboard-index.yaml on main (last_updated, company, zone_id…) without
  # touching anything the network directory reads. Such a push skips the sync (seconds, not minutes).
  # Fields read: scripts/lib/grid-directory.ts `IndexSiteEntry` — keep DIRECTORY_FIELDS in step with it.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip index changes the directory never reads
        id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "push" || -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || echo "?")
          if [[ "$CHANGED" != "dashboard-index.yaml" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git show "$BEFORE:dashboard-index.yaml" > "$RUNNER_TEMP/before.yaml"
          git show "$GITHUB_SHA:dashboard-index.yaml" > "$RUNNER_TEMP/after.yaml"
          SAME=$(python3 - "$RUNNER_TEMP/before.yaml" "$RUNNER_TEMP/after.yaml" <<'PY'
          import sys, yaml
          DIRECTORY_FIELDS = ("domain", "status", "vertical", "custom_domain", "deleted_at")
          def project(path):
              sites = (yaml.safe_load(open(path)) or {}).get("sites") or []
              return [tuple(str(s.get(k)) for k in DIRECTORY_FIELDS) for s in sites if isinstance(s, dict)]
          print("yes" if project(sys.argv[1]) == project(sys.argv[2]) else "no")
          PY
          )
          if [[ "$SAME" == "yes" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "→ Index change doesn't touch any directory field — skipping"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout platform code
        uses: actions/checkout@v4
        with:
          repository: atomicfuse/atomic-content-platform
          path: platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('platform/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: platform
        run: |
          # Retry transient registry/network flakes before failing. A flaky
          # install would otherwise trip the failure() alert even though nothing
          # is wrong with the sites.
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            echo "pnpm install failed (attempt $attempt/3) — retrying in 15s..."
            sleep 15
          done
          echo "::error::pnpm install failed after 3 attempts."
          exit 1

      - name: Build shared-types
        working-directory: platform
        run: pnpm --filter @atomic-platform/shared-types build

      - name: Select summaries to sync
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all_summaries }}
        run: |
          set -euo pipefail
          if [[ "$ALL" == "true" || "$EVENT" == "schedule" ]]; then
            echo "flag=--all-summaries" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "push" && -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'grid-summaries/' > "$RUNNER_TEMP/changed.txt" || true
            echo "flag=--changed-file $RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync grid data
        working-directory: platform/packages/site-worker
        env:
          NETWORK_DATA_PATH: ${{ github.workspace }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID_PROD: ${{ secrets.KV_NAMESPACE_ID_PROD }}
          KV_NAMESPACE_ID_STAGING: ${{ secrets.KV_NAMESPACE_ID_STAGING }}
          # Content Aggregator (Grid bundle stories). CONTENT_AGGREGATOR_URL is stale — never use it.
          CONTENT_API_BASE_URL: https://content-aggregator-v2-34cd--atomic.cloudgrid.io
        run: pnpm exec tsx scripts/seed-grid.ts ${{ steps.changed.outputs.flag }} ${{ inputs.recheck_images && '--recheck-images' || '' }}
