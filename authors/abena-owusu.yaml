bio: "Abena Owusu writes about the corners of the internet that make people laugh, gasp, or lean closer to the screen. For gigsfreaks, she follows hot trends as they take shape, rounds up the funniest animal moments, digs into unsolved internet mysteries, and shares good-vibes stories worth passing along. Her approach is curious and conversational: she explains why something is catching on, keeps the jokes friendly, and treats a good rabbit hole with equal parts enthusiasm and healthy skepticism. Abena aims to leave readers a little more informed, a little more amused, and ready to send the link to a friend."
