name: Agnieszka Wójcik
tagline: Small-space and budget decor, made warm and doable
bio: "Agnieszka Wójcik writes about making small spaces feel warm, personal and easy to live in. Her focus at Decorating Mom is budget-friendly decor: layering textiles, rethinking furniture layouts, and finding clever storage that doesn't swallow a room. She loves a good DIY project, especially ones that need more patience than special tools, and she breaks each one into clear, manageable steps. Her approach is practical and conversational. She believes a home should reflect the people in it, not a showroom, so she encourages readers to start small, experiment with what they already own, and spend money only where it truly counts."
