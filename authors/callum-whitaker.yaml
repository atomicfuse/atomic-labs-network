name: Callum Whitaker
tagline: Pop culture, viral moments & nostalgia
bio: "Callum Whitaker writes about the stories people can't stop talking about, from red carpet moments and fashion statements to viral clips and the internet trends that take over everyone's feed. He has a soft spot for entertainment nostalgia, and he loves tracing how a favorite sitcom, throwback album or early-2000s style comes back around and why it still hits home. Callum keeps his writing conversational and curious, like chatting with a friend who always knows what's trending. He focuses on context over hype, explaining why a moment caught on, and he treats celebrity news with care, sticking to what's actually known. His goal is simple: make pop culture fun, clear and a little more connected."
