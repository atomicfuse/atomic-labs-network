tagline: Electric cars, concept debuts and industry shifts
bio: "Daniel Whitaker writes about electric cars, concept debuts and the industry shifts shaping what ends up in showrooms. He's drawn to the gap between a dazzling reveal and the car you can actually buy, and he likes to explore both with curiosity rather than hype. His reviews focus on everyday questions: how a car feels on a regular commute, whether the tech earns its place, and who it's really for. When he covers industry news, he aims to cut through the jargon and explain why a story matters to enthusiasts. Expect clear, conversational writing, a healthy appetite for bold design, and a fondness for a good debate."
