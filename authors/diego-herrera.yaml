name: Diego Herrera
tagline: Paleo recipes, snacks, and the occasional cocktail
bio: "Diego Herrera writes about paleo cooking for people who love to eat and don't want to feel deprived. His recipes lean on simple ingredients, bold flavors, and weeknight-friendly steps, with plenty of attention to snacks that actually satisfy. He also builds practical meal plans, breaks down nutrition questions in plain language, and explores the food culture behind the dishes on our tables. When the day winds down, he turns to wine and cocktails, looking for pairings and low-fuss drinks that suit an ingredient-focused kitchen. Diego's approach is conversational and curious: try it, taste it, and tell it like it is."
