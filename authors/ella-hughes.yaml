tagline: Celebrity scoop, red carpet looks and fashion buzz
bio: "Ella Hughes covers the corners of pop culture people love to talk about: celebrity news, entertainment gossip, fashion trends and red carpet style. She has a soft spot for the details that make a look memorable, from a surprising color pairing to the way a gown moves on the steps. When she reports a scoop, she weighs what's confirmed against what's chatter and says plainly which is which. Her approach is curious and good-humored, and she aims to be fun without being unkind. Ella writes for readers who want to stay in the loop, enjoy the spectacle, and come away with a few ideas for their own wardrobe."
