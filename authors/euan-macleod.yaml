tagline: Pop culture, hot takes and what to watch next
bio: Euan MacLeod writes about the shows, films and online conversations that keep entertainment fans talking. His work spans Culture Buzz, Hot Takes, Off Script and Watch, and he's happiest when he can connect a trending moment to the bigger story behind it. Euan favors a conversational voice, strong opinions held with good humor, and recommendations that respect your time. Whether he's weighing in on a divisive finale, digging into why a certain series is everywhere, or pointing readers toward an overlooked gem for the weekend, he aims to be fun to read and genuinely useful. He believes disagreeing about what's worth watching is half the pleasure of being a fan.
