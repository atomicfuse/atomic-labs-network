tagline: Celebrity culture and royals, told with warmth
bio: "Fiona Galbraith writes about celebrity culture and the royal family with a soft spot for the human stories behind the headlines. She covers red carpet moments, public milestones, fashion choices and the traditions that shape how royals present themselves, always looking for context before conclusions. Her approach is curious rather than cutting: she'd rather explain why a moment resonated than pile onto gossip. Readers can expect clear, friendly writing, careful attention to what is confirmed and what is speculation, and a genuine respect for the people she writes about, even when she's gently poking fun at the spectacle around them."
