tagline: Fashion, beauty and culture, made easy to love
bio: "Imogen Hartley writes about fashion, beauty, culture, fitness and lifestyle for fashionnewsbee, with a soft spot for the ideas that make getting dressed and getting ready feel like fun rather than homework. She covers everything from seasonal wardrobe refreshes and skincare routines that actually fit into real mornings to the cultural moments shaping how we look and live. Her approach is conversational and curious: she breaks trends down into practical, wearable takeaways, celebrates personal style over rigid rules, and always keeps one question in mind: how can this make your day a little more enjoyable?"
