name: Imran Chaudhry
tagline: Chasing cold cases and buried histories
bio: "Imran Chaudhry writes about the stories that refuse to stay closed: unsolved cases, strange phenomena, buried chapters of dark history, and the conspiracy theories that grow around them. His approach is patient and curious. He lays out what is documented, flags what is rumor, and leaves room for the questions that still don't have answers. Imran favors long, careful deep dives over quick shock, and he treats the people at the center of these stories with respect. Expect a dramatic hook, a clear timeline, and an honest look at where the evidence thins out. Readers who like a good mystery and a sharp eye will feel at home here."
