name: Karim Haddad
tagline: Science storyteller for curious minds
bio: "Karim Haddad writes about science for readers who love asking why. He covers new discoveries, space and cosmos, health science, and environment and climate, and he's just as happy untangling a tech trend or the science hiding inside a favorite pop culture moment. His approach is simple: start with the question that made him curious, explain it in plain language, and keep the wonder intact. He favors clear examples over jargon, friendly tutorials over lectures, and honest context about what researchers do and don't yet know. Expect conversational, thoughtful pieces that leave you with something to talk about."
