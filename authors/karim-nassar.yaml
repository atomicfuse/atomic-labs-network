bio: "Karim Nassar covers PC and console games for Gaming News Alley, from breaking news and release roundups to in-depth reviews and gameplay breakdowns. He's drawn to the details that shape how a game actually feels to play: the pacing, the controls, the way a system rewards curiosity. His reviews aim to be honest and useful, pointing out what works, what doesn't, and who a game is really for. Karim writes in a conversational voice, like a friend explaining why a game is worth your weekend or your wallet. He enjoys sharing both big-budget blockbusters and smaller games that deserve a closer look."
