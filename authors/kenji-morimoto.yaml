tagline: Streaming picks and TV reviews for binge-watchers
bio: "Kenji Morimoto writes about television for people who always have one more episode queued up. He covers streaming releases, season-by-season reviews, and the occasional celebrity story that actually matters to fans of a show. His approach is simple: watch with an open mind, explain what works and what doesn't, and point readers toward the right series for their mood. Kenji has a soft spot for slow-burn dramas, clever comedies, and international series that deserve a bigger audience. He keeps his recommendations conversational and spoiler-conscious, so you can decide what to press play on without losing the fun of discovery."
