tagline: Covering EVs, trail rigs and concept cars
bio: "Kevin Zhou writes about electric cars, trail-ready rigs and the concept cars that hint at where the road is headed. For Clean Motion Daily, he breaks down the latest news and reviews in a conversational way, focusing on what a vehicle is actually like to live with: how far it goes, how it handles when the pavement ends, and whether the big ideas on the show stand hold up in the real world. Kevin has a soft spot for quirky designs and bold engineering, and he likes translating spec sheets into plain language. His goal is simple: help fellow enthusiasts feel informed, curious and a little more excited about what's next."
