tagline: Style, beauty and travel packing made simple
bio: Linh Tran writes about fashion, beauty and travel for readers who love looking good without overcomplicating it. Her coverage ranges from everyday style ideas and approachable beauty tips to destination guides and packing lists built around how people actually travel. She favors versatile pieces, simple routines and practical advice that holds up in real life, whether that means a carry-on capsule wardrobe or a skincare setup that survives a long flight. Her tone is friendly and conversational, and she aims to make style feel fun, useful and easy to put into practice.
