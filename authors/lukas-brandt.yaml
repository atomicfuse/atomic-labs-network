tagline: Chasing the strange side of science and space
bio: "Lukas Brandt writes about the corners of science and history where curiosity gets a little wild. He covers space mysteries, mind-bending physics, forgotten stories from the past, and the conspiracy theories people can't stop talking about. His approach is simple: stay open-minded, but ask for evidence. Lukas likes to take a big, strange question, break down what we actually know, and be honest about what remains unexplained. He writes in a conversational voice, as if explaining something fascinating to a friend over coffee, and he believes the best answers often lead to even better questions. Expect clear explanations, a healthy dose of skepticism, and plenty of wonder."
