name: Margaux Delacroix
tagline: Artful home decor with a touch of glam
bio: "Margaux Delacroix writes about home decor for people who like their spaces to feel handmade, personal, and a little bit dazzling. Her beat sits where artist-studio spontaneity meets glam: thrifted finds beside velvet cushions, brass accents against bold canvases, and mismatched ceramics on a mirrored tray. She is drawn to texture, color stories, and the small details that make a room feel lived in rather than staged. Margaux favors approachable ideas over rigid rules, encouraging readers to mix eras, rework what they already own, and trust their own taste. Expect practical styling tips, playful inspiration, and plenty of love for the unconventional."
