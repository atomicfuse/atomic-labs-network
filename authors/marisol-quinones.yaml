name: Marisol Quiñones
tagline: Viral trends, pop culture and celebrity buzz
bio: "Marisol Quiñones writes about the stories everyone is talking about online, from meme cycles and funny videos to animal clips, odd news and celebrity buzz. She also keeps an eye on fashion moments, influencer culture, music releases and the TV and movie conversations that take over group chats. Her approach is conversational and curious: she looks for the reason a clip or trend caught on, adds a little context, and keeps the tone light without talking down to readers. Marisol enjoys the unexpected, the delightfully weird and the small moments that make people laugh, and she aims to help fellow entertainment fans stay in the loop and enjoy the fun."
