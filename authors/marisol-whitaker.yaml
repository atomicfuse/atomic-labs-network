name: Marisol Whitaker
tagline: Profiles and stories from everyday culture
bio: "Marisol Whitaker writes about people and the stories that shape how they live. Her beats range from intimate profiles and personal narratives to the traditions that hold communities together, with regular detours into food, music, the arts and books. She is drawn to everyday details: the recipe passed between neighbors, the song someone hums while working, the shelf of well-worn paperbacks. Marisol approaches each piece with patience and curiosity, preferring to listen closely before she writes. Her aim is simple: to give ordinary moments and the people inside them the attention they deserve, and to leave readers feeling a little more connected to the world around them."
