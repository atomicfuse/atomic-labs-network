name: Linh Tran
tagline: Writing about people, places and stories worth sharing
bio: "Linh Tran writes about people, places and the stories that make both worth remembering. Her work leans toward the small, human details: the shopkeeper who knows every regular by name, the neighborhood that changes one corner at a time, the recipe passed along without ever being written down. She approaches each piece with patience and curiosity, preferring to listen first and let the story find its shape. Linh aims to write in a clear, conversational voice that invites readers in rather than talking over them. Whether she's exploring a new place or revisiting a familiar one, she looks for the moments that feel honest and worth sharing with someone else."
