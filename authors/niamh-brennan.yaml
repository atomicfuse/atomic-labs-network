name: Niamh Brennan
tagline: Everyday savings, from grocery aisles to utility bills
bio: "Niamh Brennan writes about the small, practical ways people can keep more of their money, from trimming the weekly grocery bill to making sense of utility statements. Her approach is friendly and down-to-earth: she breaks budgeting into simple steps, compares options clearly, and focuses on habits that fit real life rather than strict rules. On Giant Savings, she covers saving tips, smart shopping, bills, and everyday budgeting, always with an eye on what's realistic for busy households. Her goal is to make money topics feel less intimidating and a little more fun, so readers can spot savings they might have missed and feel confident about their next spending decision."
