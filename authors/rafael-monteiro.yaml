tagline: Electric cars, concept builds and off-road finds
bio: Rafael Monteiro writes about electric cars, concept builds and off-road finds for car lovers who enjoy a good story as much as a spec sheet. His coverage moves easily between industry news, new model reviews and the wild ideas that show up on show stands, always with an eye on what they might mean for everyday drivers. Rafael favors a conversational style, explaining range figures, charging quirks and suspension setups in plain language without losing the details enthusiasts care about. He is especially drawn to trail-ready machines and the way electric power is changing what off-roading can look like. Expect curious, balanced takes that celebrate great engineering while staying honest about trade-offs.
