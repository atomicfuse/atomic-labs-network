tagline: Small-space styling and budget-friendly DIY decor
bio: Sana Qureshi writes about making small spaces feel bigger, calmer, and more like home. Her work on decoratingmom and diydecorschool centers on budget-friendly decor ideas, approachable DIY projects, and practical interior design guidance that doesn't require a big renovation or a bigger wallet. She likes to start with how a room is actually used, then build from there with smart layouts, thrifted finds, and simple weekend makes. Expect clear step-by-step guides, honest product reviews, and a conversational tone that treats every reader like a friend asking for advice. Sana believes a well-loved home is built one thoughtful, affordable choice at a time.
