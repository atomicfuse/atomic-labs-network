name: Selin Aksoy
tagline: Destination guides and local culture explorer
bio: "Selin Aksoy writes destination guides and local culture stories for GeekyTraveler, with a soft spot for the details that make a place feel lived in: the neighborhood bakery, the quiet side street, the festival that never makes the brochure. Her approach is curious and practical. She likes to pair clear, usable travel tips with context about local customs, so readers arrive prepared and respectful as well as excited. She also covers adventure activities, focusing on helping people choose experiences that suit their pace and comfort level. Expect friendly, well-organized guides that invite you to slow down, ask questions, and travel with a little more wonder."
