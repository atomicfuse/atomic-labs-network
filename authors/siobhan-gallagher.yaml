tagline: Everyday nutrition, minus the myths and the fuss
bio: "Siobhán Gallagher writes about everyday nutrition for people who love food and want to feel good about what's on their plate. She covers healthy recipes, practical nutrition tips, special diets, and the often confusing world of weight and wellness. She has a soft spot for busting nutrition myths, and she does it with curiosity rather than scolding. Her approach is simple: keep advice realistic, explain the reasoning behind it, and leave room for pleasure and flexibility. Whether she's breaking down a trending claim or sharing an easy weeknight dish, Siobhán aims to make healthy eating feel doable, not draining."
