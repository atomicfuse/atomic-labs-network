bio: "Tessa Hollingworth writes about movies, streaming series and the pop culture conversations that follow them. Her coverage ranges from film reviews and trailer breakdowns to music spotlights and celebrity culture, with a steady eye on what's worth a reader's limited watch time. She approaches every piece like a chat with a friend who loves a good recommendation: honest about what works, generous toward bold swings, and always clear about why a title lands or misses. Tessa enjoys spotting the small details that make a story stick, and she aims to help entertainment fans decide what to queue up next without spoilers getting in the way."
