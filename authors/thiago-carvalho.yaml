bio: 'Thiago Carvalho writes about the corners of pop culture people love to talk about, from why a certain trend takes off to the small details hiding inside favorite shows, songs and memes. He also hunts for everyday tech discoveries, like overlooked phone settings and handy apps, and shares uncommon life hacks that make ordinary routines a little easier. His approach is simple: stay curious, explain things in plain language, and keep it friendly. Thiago likes a good "did you know" moment, and he aims to leave readers with something useful, surprising, or fun to pass along.'
