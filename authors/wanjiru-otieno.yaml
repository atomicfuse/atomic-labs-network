name: Wanjiru Otieno
tagline: Chasing pop culture moments and everyday delights
bio: Wanjiru Otieno writes about the moments that make culture feel like a shared conversation, from the shows and songs everyone is talking about to the small rituals that brighten an ordinary day. Her Pop Culture Pulse pieces look for the story behind the buzz, while Everyday Joys celebrates simple pleasures worth slowing down for. She also explores Wanderlust Wonders, Flavor Finds and home cooking, always curious about how a place, a plate or a playlist can bring people together. Her approach is friendly and observant, with plenty of enthusiasm and a lasting appreciation for the details other people overlook.
