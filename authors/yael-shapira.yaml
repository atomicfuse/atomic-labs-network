name: Yael Shapira
tagline: Everyday wellness, mindful habits and healthy aging
bio: Yael Shapira writes about everyday wellness for readers who want healthy living to feel doable, not overwhelming. Her work spans fitness and movement, nutrition, simple healthy recipes, mindfulness and the small habits that support healthy aging. She favors practical ideas over perfection, like gentle routines you can actually keep, meals built around whole foods, and quiet moments that help the mind and body check in with each other. Her tone is conversational and encouraging, and she aims to explain the why behind a habit so readers can adapt it to their own lives. Yael writes for the health-conscious and the curious alike, always with warmth and a good dose of realism.
