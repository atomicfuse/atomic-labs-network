name: Yoav Shapira
tagline: Making science click with pop culture and tech
bio: "Yoav Shapira writes about science where it meets the things people already love: blockbuster movies, video games, the gadgets in their pockets, and whatever is trending this week. His approach is simple. Start with the curiosity a good story or a clever piece of tech sparks, then follow it down to the real science underneath. Expect plain-language explainers, step-by-step tutorials for hands-on readers, and a conversational voice that treats you like a fellow fan rather than a student. Yoav is especially drawn to questions like how a special effect might actually work, or why a new trend deserves a closer look. He aims to leave readers a little more curious than when they arrived."
