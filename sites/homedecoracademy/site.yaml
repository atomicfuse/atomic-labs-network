  content_guidelines:
    - Beginner-friendly decorating advice with clear, actionable steps.
    - Focus on room styling, small spaces, color, lighting, and budget updates.
    - Use short paragraphs, helpful lists, and realistic examples.
    - Keep the tone warm and approachable; avoid jargon and exaggerated promises.
  image_guidelines:
    - Bright, realistic interiors that feel inviting and achievable.
    - Show varied home sizes, styles, and budgets.
    - Match each image to the specific decorating tip.
    - Favor natural light, accurate colors, and uncluttered compositions.
    - Avoid overly luxurious spaces, heavy filters, text overlays, and distorted AI details.
