  content_guidelines:
    - Content Guidelines
    - Section	What to cover	Example headline
    - Animals & Wildlife	Familiar animal behaviors, habitats, and
      adaptations	Why Do Birds Fly in a V?
    - Plants & Trees	How plants grow, reproduce, and respond to the seasons	Why
      Do Some Trees Keep Their Leaves All Winter?
    - Insects & Backyard Life	Pollinators, garden insects, fungi, and other
      discoveries close to home	Why Do Fireflies Light Up?
    - Land & Water	How rivers, coastlines, rocks, and soil change over time	Why
      Do Rivers Bend?
    - Nature Through the Seasons	Migration, blooms, and seasonal changes readers
      can spot	Why Do Some Flowers Close at Night?
    - "- Start with something readers can picture. Open with a familiar sight,
      give the short answer, then explain how it works in plain English."
    - "- Give readers something to notice next time. A story on river bends
      could point out the sand or gravel that often collects on the inside of a
      bend."
    - "- Be specific about species and regions. When a behavior varies by
      species, season, or location, say where it applies. Verify details with
      reliable sources such as museums, universities, or wildlife agencies."
  image_guidelines:
    - Image Guidelines
    - "- Show the subject in its natural setting. Use a flock in formation, a
      seedling emerging from soil, or an overhead view of a winding river.
      Choose an image that shows the feature the article explains."
    - "- Make details easy to recognize. Use a close-up for leaf veins or an
      insect’s wings. Include surroundings when habitat, scale, or movement
      matters."
    - "- Use natural-looking photography. Favor true-to-life colors and a clear
      focal point. Use 16:9 landscape hero images and keep the main subject near
      the center for mobile crops."
    - "- Check identification and captions. Verify the species when the article
      names one. Use simple, labeled diagrams for processes that are hard to
      photograph, such as water moving through a plant. Credit images as
      required and write alt text that describes what readers can see."
