  content_guidelines:
    - Content guidelines
    - "- Pantry dinners. Focus on familiar ingredients like canned beans, rice,
      pasta, lentils, and tinned fish. Examples: Creamy White Bean Pasta and
      15-Minute Tuna Rice Bowls."
    - "- Crispy favorites. Cover oven, stovetop, and air-fryer recipes.
      Examples: Crispy Chickpeas with Smoked Paprika and Sheet-Pan Potato and
      Black Bean Tacos."
    - "- Snacks and simple baking. Feature recipes like Peanut Butter Oat
      Cookies, Homemade Pita Chips, and No-Bake Chocolate Oat Bars."
    - "- Make recipes easy to follow. Include servings, prep and cook times,
      common substitutions, and cues for doneness. For crispy recipes, explain
      the step that makes the difference, such as drying the chickpeas before
      roasting."
  image_guidelines:
    - Image guidelines
    - "- Use realistic food photography in warm natural light. Show the finished
      dish in an everyday kitchen setting with simple plates and cookware."
    - "- Make texture visible. Capture golden edges, toasted crumbs, flaky
      layers, or a cut-open portion that shows the inside."
    - "- Match the recipe closely. Show the actual ingredients, toppings, and
      cooking result so readers know what to expect."
    - "- Use a landscape lead image with the dish centered for mobile cropping.
      Add step photos where they help readers judge texture or doneness."
