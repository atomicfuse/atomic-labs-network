  content_guidelines:
    - popstorylab.com sounds like a pop culture and entertainment site—celebrity
      stories, TV, movies, music, and viral internet moments.
    - "I’d position it as “The stories behind what’s trending.” The “lab” gives
      it a curious angle: explain why something went viral, uncover
      behind-the-scenes details, and revisit nostalgic favorites."
    - "Good content categories:"
    - "- Celebrity buzz: surprising stories and career updates."
    - "- TV & movies: cast news, hidden details, and filming secrets."
    - "- Viral culture: internet trends and the people behind them."
    - "- Nostalgia: where-are-they-now stories and iconic pop culture moments."
    - For your publishing portfolio, entertainment with curiosity-driven
      headlines is the strongest fit.
    - "Tagline: Pop culture. Unexpected stories."
  image_guidelines:
    - Use vibrant, high-quality images featuring celebrities, movie and TV
      scenes, music events, and viral moments. Favor expressive faces, candid
      shots, and bold colors that catch attention on mobile.
    - Keep images relevant to the story, with minimal text and uncluttered
      compositions. Use licensed or permission-cleared visuals. Avoid misleading
      edits, intrusive paparazzi photos, and AI-generated images presented as
      real events.
