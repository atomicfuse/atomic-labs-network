  content_guidelines:
    - Write helpful, engaging articles about home décor, organization, small spaces, and everyday living. Use a warm, approachable tone with clear headings, short paragraphs, and practical tips. Include affordable ideas for different home sizes and budgets. Keep headlines accurate and specific, and ensure every article delivers on its promise. Create original content; verify factual claims and avoid invented expert quotes or unsupported product claims.
  image_guidelines:
    - Use bright, high-quality images of inviting interiors, décor details, organized spaces, and realistic home improvements. Favor natural light, balanced compositions, and a warm, cohesive palette. Match images closely to the article’s subject and include varied home styles and sizes. Use original or properly licensed images. Avoid watermarks, text overlays, visible third-party logos, distorted objects, and misleading before-and-after comparisons.
