  content_guidelines:
    - Tagline · Why the weather does what it does.
    - Content Guidelines
    - Section	What to cover	Example headline
    - Everyday Weather	Rain, wind, fog, humidity, and temperature	Why Does It
      Feel Colder When It’s Windy?
    - Storms Explained	Thunderstorms, lightning, hail, and heavy rain	Why Does
      It Hail in the Summer?
    - The Forecast	Forecast changes and common weather terms	Why Did the
      Forecast Change Overnight?
    - Seasonal Weather	Cold snaps, heat waves, frost, and seasonal patterns	Why
      Can It Frost When the Forecast Says 36°F?
    - "- Answer the question up front. Give the short answer in the first
      paragraph, then explain what causes it with a familiar example."
    - "- Write for a general audience. Define technical terms in context and use
      specific headlines readers can recognize from their own experience."
    - "- Use timely weather to tell evergreen stories. A stretch of foggy
      mornings can prompt an explainer on how fog forms. When covering an active
      weather event, verify the location, timing, and conditions with the
      relevant official weather service."
  image_guidelines:
    - Show the condition clearly. Use low fog along a tree line, hailstones
      beside a ruler, frost on a windshield, or wind bending tall grass. Pick a
      scene that helps explain the story.
    - Use realistic editorial photography. Favor natural color, one clear focal
      point, and a 16:9 landscape crop with the subject near the center for
      mobile.
    - Use diagrams when the cause is invisible. A simple diagram can show how
      hills channel wind or how cold air settles in a valley.
    - Caption images accurately. Identify file photos and illustrations. For a
      specific storm or weather event, verify where and when the photo was
      taken. Include required credits and descriptive alt text.
