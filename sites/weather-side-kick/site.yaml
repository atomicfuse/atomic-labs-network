  content_guidelines:
    - Content Guidelines
    - "Editorial focus: WeatherSidekick.com covers everyday weather and how it
      affects readers’ plans, travel, homes, and routines. Every article should
      answer a question people actually ask or help them make a decision."
    - Section	What to publish	Example headline
    - Weather News	Timely weather events and what they mean for affected
      areas	An Early Cold Snap Is Coming to the Midwest. Here’s What to Expect
    - Everyday Weather	Quick answers to common weather questions	What Does a 40%
      Chance of Rain Mean?
    - Travel & Outdoors	Weather considerations for road trips, beach days, and
      outdoor plans	How Wind Can Change Your Beach Day Plans
    - Home & Seasons	Practical, seasonal stories for the home and garden	When
      Should You Cover Your Plants Before a Frost?
    - Weather Explained	Plain-English explanations of familiar weather
      patterns	Why Does Humidity Make It Feel Hotter?
    - "- Tone: Friendly, clear, and practical. Explain weather terms in plain
      English as they come up."
    - "- Headlines: Be specific and deliver on the promise. Mention the location
      when a story applies to a particular region."
    - "- Structure: Give the answer or main takeaway in the opening paragraph.
      Use short paragraphs, descriptive subheadings, and bullets for practical
      steps."
    - "- Sources: Use the relevant official weather service for forecasts and
      alerts. For time-sensitive stories, include the affected area, time zone,
      and when the information was last checked. Link to the official advisory
      when one is active."
    - "- Publishing mix: Build around seasonal guides and evergreen explainers,
      then add timely weather stories when they affect your readers."
  image_guidelines:
    - "Visual direction: Use realistic, editorial-style photography that makes
      the weather easy to recognize and shows how it affects everyday life."
    - Story type	Image direction
    - Rain and commuting	Pedestrians with umbrellas on a wet city street
    - Heat and humidity	People looking for shade on a sunny afternoon
    - Winter weather	A driver clearing snow from a parked car
    - Home and garden	A close-up of frost on garden plants
    - Travel and outdoors	A windy beach with flags, dune grass, or beachgoers in
      frame
    - "- Composition: Use one clear focal point. Keep it near the center so it
      survives mobile and thumbnail crops. A landscape 16:9 image works well as
      the default hero."
    - "- Style: Favor natural light, true-to-life colors, and familiar settings.
      Keep hero images free of text overlays and watermarks."
    - "- News accuracy: Use verified photos for coverage of specific events.
      Label file photos and illustrations clearly so readers know what they’re
      seeing."
    - "- Rights and accessibility: Use owned or licensed images, add credits
      where required, and write concise alt text that describes the visible
      scene."
